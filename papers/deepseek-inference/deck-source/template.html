<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install & Use the Presentation Skills — Outline-Driven Deck</title>
  <style>
    /* =========================================================
       Theme tokens — both light & dark are fully built.
       Switch via ⚙ panel (sets data-theme on <html>).
       ========================================================= */
    :root {
      --canvas-w: 1400px;
      --canvas-h: 900px;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, monospace;
      --transition: 280ms cubic-bezier(.4,.0,.2,1);
    }
    [data-theme="dark"] {
      --bg: #0b0b0d;
      --bg-elev: #16161a;
      --bg-card: #1d1d22;
      --fg: #e6e6ea;
      --fg-dim: #9a9aa3;
      --accent: #6aa9ff;
      --border: #2a2a31;
      --code-bg: #0f0f12;
    }
    [data-theme="light"] {
      --bg: #fafafa;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --fg: #1a1a1f;
      --fg-dim: #6b6b75;
      --accent: #2a6df4;
      --border: #e3e3e8;
      --code-bg: #f3f3f6;
    }

    /* =========================================================
       Base layout
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      overflow: hidden;
      height: 100vh;
    }
    body { display: flex; }

    /* =========================================================
       Outline sidebar (left, derived from DOM)
       ========================================================= */
    #outline {
      width: 280px;
      flex: 0 0 280px;
      background: var(--bg-elev);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      overflow-y: auto;
      font-size: 13px;
    }
    #outline h3 {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin: 0 8px 12px;
    }
    #outline .section-group { margin-bottom: 14px; }
    #outline .section-name {
      font-weight: 600;
      color: var(--fg);
      padding: 6px 8px;
      font-size: 12px;
      letter-spacing: .04em;
    }
    #outline ol { list-style: none; margin: 0; padding: 0; }
    #outline li {
      padding: 4px 8px 4px 24px;
      color: var(--fg-dim);
      cursor: pointer;
      border-radius: 4px;
      line-height: 1.4;
    }
    #outline li:hover { background: var(--bg-card); color: var(--fg); }
    #outline li.active { color: var(--accent); background: var(--bg-card); }

    /* =========================================================
       Stage (right, hosts the 1400×900 canvas)
       ========================================================= */
    #stage-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }
    #stage {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      background: var(--bg-elev);
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
      overflow: hidden;
      transform-origin: center center;
      transition: transform 100ms ease-out;
      flex-shrink: 0;
    }

    /* =========================================================
       Slides
       ========================================================= */
    .slide {
      position: absolute; inset: 0;
      padding: 80px 90px;
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      gap: 28px;
    }
    .slide.active { display: flex; }
    .slide h1 {
      font-family: var(--font-display);
      font-size: 56px;
      line-height: 1.15;
      margin: 0;
      letter-spacing: -.01em;
    }
    .slide h2 {
      font-family: var(--font-display);
      font-size: 36px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: -.005em;
    }
    .slide h3 {
      font-family: var(--font-display);
      font-size: 22px;
      margin: 0 0 6px;
      color: var(--fg-dim);
    }
    .slide p { font-size: 22px; line-height: 1.55; margin: 0; }
    .slide ul, .slide ol { font-size: 22px; line-height: 1.7; margin: 0; padding-left: 28px; }
    .slide li { margin-bottom: 6px; }
    .slide .lede { font-size: 28px; color: var(--fg-dim); }
    .slide .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
    }
    .slide pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      font-family: var(--font-mono);
      font-size: 16px;
      line-height: 1.5;
      overflow: auto;
      max-height: 100%;
    }
    .slide code { font-family: var(--font-mono); }
    .slide .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--fg-dim);
      margin-right: 8px;
    }
    .slide .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .slide .cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

    /* =========================================================
       Toolbar (top-right of stage)
       ========================================================= */
    #toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }
    #toolbar button {
      background: transparent;
      border: 0;
      color: var(--fg);
      width: 34px; height: 34px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #toolbar button:hover { background: var(--bg-elev); }
    #toolbar button.active { background: var(--accent); color: white; }

    /* =========================================================
       Status bar (bottom-right, slide counter + progress)
       ========================================================= */
    #statusbar {
      position: absolute;
      bottom: 16px; right: 24px;
      font-size: 13px;
      color: var(--fg-dim);
      font-family: var(--font-mono);
      z-index: 5;
    }
    #progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: var(--accent);
      transition: width var(--transition);
    }

    /* =========================================================
       Laser pointer (hidden until toggled)
       ========================================================= */
    #laser {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 10px rgba(255,59,48,.8);
      pointer-events: none;
      display: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
    }

    /* =========================================================
       Settings modal
       ========================================================= */
    #settings-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #settings-modal.open { display: flex; }
    #settings-modal .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      width: 420px;
    }
    #settings-modal h2 {
      margin: 0 0 20px;
      font-family: var(--font-display);
      font-size: 20px;
    }
    #settings-modal label {
      display: block;
      margin: 14px 0 4px;
      font-size: 13px;
      color: var(--fg-dim);
    }
    #settings-modal select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    /* =========================================================
       Print (PDF export) — one slide per page, hide chrome
       ========================================================= */
    @media print {
      body { overflow: visible; height: auto; }
      #outline, #toolbar, #statusbar, #progress, #laser, #settings-modal { display: none !important; }
      #stage-wrap { display: block; }
      #stage {
        transform: none !important;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }
      .slide { display: flex !important; position: relative; inset: auto; }
      /* only show the active slide during print, then advance via window.print slicing in JS */
    }
  </style>
</head>
<body>

  <!-- =================== Outline sidebar =================== -->
  <nav id="outline" aria-label="Outline">
    <h3>Outline</h3>
    <div id="outline-tree"><!-- derived from DOM by JS --></div>
  </nav>

  <!-- =================== Stage =================== -->
  <div id="stage-wrap">
    <div id="stage">

      <!-- Toolbar -->
      <div id="toolbar">
        <button id="btn-outline" title="Toggle outline (o)">☰</button>
        <button id="btn-laser" title="Laser pointer (l)">●</button>
        <button id="btn-fullscreen" title="Fullscreen (f)">⛶</button>
        <button id="btn-pdf" title="Export PDF (p)">📄</button>
        <button id="btn-settings" title="Settings (s)">⚙</button>
      </div>

      <!-- Status + progress -->
      <div id="statusbar"><span id="slideCounter">1 / 1</span></div>
      <div id="progress" style="width: 0%"></div>

      <!-- ============================================================
           SLIDES — presentation-skills & pptx complete guide.
           This deck is built with generate-outline-deck.
           ============================================================ -->

      <!-- 1: Title -->
      <section class="slide" data-deck="v1" data-section="Content" data-title="Content"></section>


    </div>
  </div>

  <!-- =================== Settings modal =================== -->
  <div id="settings-modal" role="dialog" aria-label="Settings">
    <div class="panel">
      <h2>Settings</h2>
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
      <label for="font-select">Font</label>
      <select id="font-select">
        <option value="SF Pro">SF Pro</option>
        <option value="Helvetica">Helvetica</option>
        <option value="Avenir">Avenir</option>
        <option value="Georgia">Georgia</option>
        <option value="Menlo">Menlo</option>
      </select>
      <label for="transition-select">Transition</label>
      <select id="transition-select">
        <option value="fade">Fade</option>
        <option value="slide-left">Slide left</option>
        <option value="zoom">Zoom</option>
        <option value="none">None</option>
      </select>
    </div>
  </div>

  <!-- =================== Laser pointer dot =================== -->
  <div id="laser"></div>

  <script>
  (function () {
    'use strict';

    // ---------- Derived outline ----------
    const slides = Array.from(document.querySelectorAll('.slide'));
    const tree = document.getElementById('outline-tree');
    const sections = {};
    slides.forEach((s, i) => {
      const sec = s.dataset.section || '(no section)';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push({ idx: i, title: s.dataset.title || `slide ${i + 1}` });
    });
    Object.keys(sections).forEach(secName => {
      const group = document.createElement('div');
      group.className = 'section-group';
      const head = document.createElement('div');
      head.className = 'section-name';
      head.textContent = secName;
      group.appendChild(head);
      const ol = document.createElement('ol');
      sections[secName].forEach(({ idx, title }) => {
        const li = document.createElement('li');
        li.textContent = `${idx + 1}. ${title}`;
        li.dataset.idx = idx;
        li.addEventListener('click', () => goTo(idx));
        ol.appendChild(li);
      });
      group.appendChild(ol);
      tree.appendChild(group);
    });

    // ---------- Navigation state ----------
    let current = parseInt(location.hash.replace('#', ''), 10);
    if (!Number.isFinite(current) || current < 1 || current > slides.length) current = 1;
    current = current - 1;

    const counter = document.getElementById('slideCounter');
    const progress = document.getElementById('progress');
    const outlineItems = () => document.querySelectorAll('#outline li');

    function render() {
      slides.forEach((s, i) => s.classList.toggle('active', i === current));
      counter.textContent = `${current + 1} / ${slides.length}`;
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      outlineItems().forEach(li => {
        li.classList.toggle('active', Number(li.dataset.idx) === current);
      });
      location.hash = current + 1;
    }

    function goTo(i) {
      if (i < 0 || i >= slides.length) return;
      current = i;
      render();
    }

    function next() { goTo(Math.min(current + 1, slides.length - 1)); }
    function prev() { goTo(Math.max(current - 1, 0)); }

    // ---------- Keyboard ----------
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ': next(); e.preventDefault(); break;
        case 'ArrowLeft':  case 'PageUp':           prev(); e.preventDefault(); break;
        case 'Home': goTo(0); break;
        case 'End':  goTo(slides.length - 1); break;
        case 'o': case 'O': toggleOutline(); break;
        case 'l': case 'L': toggleLaser(); break;
        case 'f': case 'F': toggleFullscreen(); break;
        case 'p': case 'P': exportPdf(); break;
        case 's': case 'S': openSettings(); break;
        case 'Escape':
          document.getElementById('settings-modal').classList.remove('open');
          break;
      }
    });

    // ---------- Dynamic Responsive Auto-Scaling ----------
    function updateScale() {
      const wrap = document.getElementById('stage-wrap');
      const stage = document.getElementById('stage');
      if (!wrap || !stage) return;
      const isFullscreen = !!document.fullscreenElement;
      const padX = isFullscreen ? 0 : 24;
      const padY = isFullscreen ? 0 : 24;
      const availW = Math.max(wrap.clientWidth - padX, 200);
      const availH = Math.max(wrap.clientHeight - padY, 200);
      const scale = Math.min(availW / 1400, availH / 900);
      stage.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', updateScale);
    document.addEventListener('fullscreenchange', updateScale);
    if (window.ResizeObserver) {
      new ResizeObserver(() => updateScale()).observe(document.getElementById('stage-wrap'));
    }

    // ---------- Toolbar ----------
    function toggleOutline() {
      const outline = document.getElementById('outline');
      outline.style.display = outline.style.display === 'none' ? 'block' : 'none';
      requestAnimationFrame(updateScale);
    }
    document.getElementById('btn-outline').addEventListener('click', toggleOutline);

    // ---------- Laser pointer ----------
    const laser = document.getElementById('laser');
    let laserOn = false;
    function toggleLaser() {
      laserOn = !laserOn;
      laser.style.display = laserOn ? 'block' : 'none';
      document.getElementById('btn-laser').classList.toggle('active', laserOn);
    }
    document.addEventListener('mousemove', e => {
      laser.style.left = e.clientX + 'px';
      laser.style.top  = e.clientY + 'px';
    });
    document.getElementById('btn-laser').addEventListener('click', toggleLaser);

    // ---------- Fullscreen ----------
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

    // ---------- PDF export (uses browser print) ----------
    function exportPdf() {
      // Show all slides during print, then restore.
      const wasActive = slides.map(s => s.classList.contains('active'));
      slides.forEach(s => s.classList.add('active'));
      const onAfter = () => {
        slides.forEach((s, i) => s.classList.toggle('active', wasActive[i]));
        window.removeEventListener('afterprint', onAfter);
      };
      window.addEventListener('afterprint', onAfter);
      window.print();
    }
    document.getElementById('btn-pdf').addEventListener('click', exportPdf);

    // ---------- Settings ----------
    const settingsModal = document.getElementById('settings-modal');
    function openSettings()  { settingsModal.classList.add('open'); }
    function closeSettings() { settingsModal.classList.remove('open'); }
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });

    const themeSel = document.getElementById('theme-select');
    const fontSel  = document.getElementById('font-select');
    const transSel = document.getElementById('transition-select');

    themeSel.value = document.documentElement.dataset.theme || 'dark';
    themeSel.addEventListener('change', () => {
      document.documentElement.dataset.theme = themeSel.value;
      try { localStorage.setItem('deck-theme', themeSel.value); } catch (_) {}
    });
    fontSel.addEventListener('change', () => {
      document.documentElement.style.setProperty('--font-ui', fontFamilyFor(fontSel.value));
      document.documentElement.style.setProperty('--font-display', fontFamilyFor(fontSel.value));
    });
    transSel.addEventListener('change', () => {
      const t = transSel.value;
      const map = {
        'fade':      '280ms cubic-bezier(.4,.0,.2,1)',
        'slide-left': '320ms cubic-bezier(.4,.0,.2,1)',
        'zoom':      '280ms cubic-bezier(.4,.0,.2,1)',
        'none':      '0ms'
      };
      document.documentElement.style.setProperty('--transition', map[t]);
    });
    function fontFamilyFor(name) {
      switch (name) {
        case 'SF Pro':    return '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
        case 'Helvetica': return '"Helvetica Neue", Helvetica, Arial, sans-serif';
        case 'Avenir':    return 'Avenir, "Avenir Next", -apple-system, sans-serif';
        case 'Georgia':   return 'Georgia, "Times New Roman", serif';
        case 'Menlo':     return '"SF Mono", Menlo, Consolas, monospace';
        default:          return '-apple-system, BlinkMacSystemFont, sans-serif';
      }
    }

    // ---------- Restore prefs ----------
    try {
      const savedTheme = localStorage.getItem('deck-theme');
      if (savedTheme) {
        document.documentElement.dataset.theme = savedTheme;
        themeSel.value = savedTheme;
      }
    } catch (_) {}

    // ---------- Init ----------
    render();
    updateScale();

    // Hide outline button reflects state (purely visual)
    document.getElementById('btn-outline').addEventListener('click', function () {
      this.classList.toggle('active');
    });
  })();
  </script>
</body>
</html>
